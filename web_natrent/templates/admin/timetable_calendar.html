{% extends "admin/base_site.html" %}
{% load i18n static %}


{% block content %}
<style>
    #nr-cal, #nr-cal * { box-sizing: border-box; }
    #nr-cal {
        --nr-accent: #5C7185;
        --nr-accent-dark: #4C5E70;
        --nr-ink: #1C1F23;
        --nr-muted: #8B939B;
        --nr-border: #E3E6E9;
        --nr-closed-bg: #F7E7E7;
        --nr-closed-ink: #A8524F;
        max-width: 620px;
        margin: 20px auto 120px;
        font-size: 14px;
        color: var(--nr-ink);
        -webkit-tap-highlight-color: transparent;
    }
    .nr-card {
        background: #fff;
        border: 1px solid var(--nr-border);
        border-radius: 16px;
        padding: 20px;
    }
    .nr-house {
        margin-bottom: 14px;
    }
    .nr-house label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: var(--nr-muted);
        text-transform: uppercase;
        letter-spacing: .04em;
        margin-bottom: 6px;
    }
    .nr-select {
        width: 100%;
        height: 44px;
        border: 1px solid var(--nr-border);
        border-radius: 10px;
        padding: 0 12px;
        background: #fff;
        color: var(--nr-ink);
        font-family: inherit;
        font-size: 15px;
        cursor: pointer;
    }
    .nr-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
    }
    .nr-head__title {
        font-size: 16px;
        font-weight: 700;
    }
    .nr-nav {
        width: 38px;
        height: 38px;
        border: 1px solid var(--nr-border);
        border-radius: 10px;
        background: #fff;
        cursor: pointer;
        font-size: 20px;
        line-height: 1;
        color: #41474E;
        font-family: inherit;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .nr-nav:hover { background: #F0F2F4; }
    .nr-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        text-align: center;
    }
    .nr-wd {
        font-size: 11px;
        font-weight: 700;
        color: var(--nr-muted);
        text-transform: uppercase;
        letter-spacing: .03em;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .nr-wd--we { color: #B98A88; }
    .nr-day {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        height: 56px;
        border: none;
        border-radius: 10px;
        background: transparent;
        cursor: pointer;
        font-family: inherit;
        color: var(--nr-ink);
        transition: background .15s;
        padding: 0;
        user-select: none;
    }
    .nr-day:hover { background: #F0F2F4; }
    .nr-day__num { font-size: 14px; font-weight: 600; line-height: 1; }
    .nr-day__price { font-size: 10px; line-height: 1; color: var(--nr-muted); }
    .nr-day.is-empty { visibility: hidden; cursor: default; }
    .nr-day.is-past { opacity: .45; }
    .nr-day.is-today { box-shadow: inset 0 0 0 1px var(--nr-accent); }
    .nr-day.is-closed { background: var(--nr-closed-bg); }
    .nr-day.is-closed .nr-day__num { color: var(--nr-closed-ink); text-decoration: line-through; }
    .nr-day.is-inrange { background: #E7EBEF; border-radius: 0; }
    .nr-day.is-closed.is-inrange { background: #EDDCDC; }
    /* Граничные даты диапазона: полузаливка в сторону диапазона */
    .nr-day.is-closed.is-closed-start:not(.is-closed-end) {
        background: linear-gradient(to right, transparent 50%, var(--nr-closed-bg) 50%);
    }
    .nr-day.is-closed.is-closed-start:not(.is-closed-end):hover {
        background: linear-gradient(to right, #F0F2F4 50%, var(--nr-closed-bg) 50%);
    }
    .nr-day.is-closed.is-closed-end:not(.is-closed-start) {
        background: linear-gradient(to left, transparent 50%, var(--nr-closed-bg) 50%);
    }
    .nr-day.is-closed.is-closed-end:not(.is-closed-start):hover {
        background: linear-gradient(to left, #F0F2F4 50%, var(--nr-closed-bg) 50%);
    }
    /* Граничные даты доступны для выбора — без зачёркивания */
    .nr-day.is-closed-start:not(.is-closed-end) .nr-day__num,
    .nr-day.is-closed-end:not(.is-closed-start) .nr-day__num { text-decoration: none; }
    .nr-day.is-edge { background: var(--nr-accent); }
    .nr-day.is-edge:hover { background: var(--nr-accent-dark); }
    .nr-day.is-edge .nr-day__num { color: #fff; text-decoration: none; }
    .nr-day.is-edge .nr-day__price { color: rgba(255,255,255,.75); }
    .nr-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 14px;
        font-size: 12px;
        color: var(--nr-muted);
    }
    .nr-legend span { display: flex; align-items: center; gap: 6px; }
    .nr-legend i {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        display: inline-block;
    }
    .nr-legend .nr-legend__closed { background: var(--nr-closed-bg); border: 1px solid #E5C9C9; }
    .nr-legend .nr-legend__sel { background: var(--nr-accent); }
    .nr-legend .nr-legend__today { background: #fff; box-shadow: inset 0 0 0 1px var(--nr-accent); }

    .nr-actions {
        position: sticky;
        bottom: 12px;
        margin-top: 12px;
        background: #fff;
        border: 1px solid var(--nr-border);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 10px 30px rgba(28,31,35,.16);
    }
    .nr-actions[hidden] { display: none; }
    .nr-actions__info {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 12px;
    }
    .nr-actions__btns {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }
    .nr-btn {
        flex: 1 1 auto;
        height: 42px;
        padding: 0 16px;
        border: none;
        border-radius: 10px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: filter .15s;
        white-space: nowrap;
    }
    .nr-btn:hover { filter: brightness(.94); }
    .nr-btn--danger { background: var(--nr-closed-ink); color: #fff; }
    .nr-btn--success { background: #4F7D5B; color: #fff; }
    .nr-btn--primary { background: var(--nr-accent); color: #fff; }
    .nr-btn--ghost { background: #fff; color: var(--nr-accent); border: 1px solid var(--nr-border); }
    .nr-cost-editor {
        display: flex;
        gap: 8px;
        margin-top: 12px;
    }
    .nr-cost-editor[hidden] { display: none; }
    .nr-cost-editor input {
        flex: 1;
        min-width: 0;
        height: 42px;
        border: 1px solid var(--nr-border);
        border-radius: 10px;
        padding: 0 12px;
        font-family: inherit;
        font-size: 15px;
        color: var(--nr-ink);
        background: #fff;
    }
    .nr-msg {
        margin-top: 10px;
        font-size: 13px;
        font-weight: 600;
    }
    .nr-msg[hidden] { display: none; }
    .nr-msg--error { color: var(--nr-closed-ink); }
    .nr-msg--ok { color: #4F7D5B; }
    .nr-toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        background: #2E3A45;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        padding: 12px 22px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(28,31,35,.3);
        z-index: 100;
        opacity: 0;
        pointer-events: none;
        transition: opacity .2s;
    }
    .nr-toast.is-visible { opacity: 1; }

    @media (max-width: 768px) {
        #nr-cal { margin: 6px auto 90px; padding: 0 4px; }
        .nr-card { padding: 12px; border-radius: 12px; }
        .nr-day { height: 48px; border-radius: 8px; gap: 2px; }
        .nr-day__num { font-size: 13px; }
        .nr-day__price { font-size: 9px; }
        .nr-grid { gap: 2px; }
        .nr-actions { padding: 12px; bottom: 8px; }
        .nr-btn { flex: 1 1 45%; padding: 0 8px; }
    }
</style>

<div id="nr-cal">
    <div class="nr-card">
        <div class="nr-house">
            <label for="nrHouseSelect">Объект аренды</label>
            <select id="nrHouseSelect" class="nr-select">
                {% for house in objects %}
                    <option value="{{ house.id }}">{{ house.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="nr-head">
            <button type="button" class="nr-nav" id="nrPrev" aria-label="Предыдущий месяц">‹</button>
            <span class="nr-head__title" id="nrTitle"></span>
            <button type="button" class="nr-nav" id="nrNext" aria-label="Следующий месяц">›</button>
        </div>
        <div class="nr-grid">
            <span class="nr-wd">Пн</span><span class="nr-wd">Вт</span><span class="nr-wd">Ср</span><span class="nr-wd">Чт</span><span class="nr-wd">Пт</span><span class="nr-wd nr-wd--we">Сб</span><span class="nr-wd nr-wd--we">Вс</span>
        </div>
        <div class="nr-grid" id="nrGrid"></div>
        <div class="nr-legend">
            <span><i class="nr-legend__closed"></i>Закрыто / забронировано</span>
            <span><i class="nr-legend__sel"></i>Выбрано</span>
            <span><i class="nr-legend__today"></i>Сегодня</span>
        </div>
    </div>

    <div class="nr-actions" id="nrActions" hidden>
        <div class="nr-actions__info" id="nrInfo"></div>
        <div class="nr-actions__btns">
            <button type="button" class="nr-btn nr-btn--danger" id="nrCloseBtn">Закрыть даты</button>
            <button type="button" class="nr-btn nr-btn--success" id="nrOpenBtn">Открыть даты</button>
            <button type="button" class="nr-btn nr-btn--primary" id="nrEditBtn">Редактировать стоимость</button>
            <button type="button" class="nr-btn nr-btn--ghost" id="nrClearBtn">Сбросить</button>
        </div>
        <div class="nr-cost-editor" id="nrCostEditor" hidden>
            <input type="number" id="nrCostInput" min="0" step="100" placeholder="Стоимость за ночь, ₽">
            <button type="button" class="nr-btn nr-btn--primary" id="nrApplyCostBtn">Применить</button>
        </div>
        <div class="nr-msg" id="nrMsg" hidden></div>
    </div>
    <div class="nr-toast" id="nrToast"></div>
</div>

<script>
(function () {
    'use strict';

    var ACTION_URL = "{% url 'admin:timetable_calendar' %}";
    var CSRF_TOKEN = "{{ csrf_token }}";
    var booked = JSON.parse('{{ booked_days_json|escapejs }}');
    var costs = JSON.parse('{{ dates_object_cost_json|escapejs }}');

    var MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
    var MONTHS_R = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

    var el = {
        house: document.getElementById('nrHouseSelect'),
        title: document.getElementById('nrTitle'),
        grid: document.getElementById('nrGrid'),
        prev: document.getElementById('nrPrev'),
        next: document.getElementById('nrNext'),
        actions: document.getElementById('nrActions'),
        info: document.getElementById('nrInfo'),
        closeBtn: document.getElementById('nrCloseBtn'),
        openBtn: document.getElementById('nrOpenBtn'),
        editBtn: document.getElementById('nrEditBtn'),
        clearBtn: document.getElementById('nrClearBtn'),
        costEditor: document.getElementById('nrCostEditor'),
        costInput: document.getElementById('nrCostInput'),
        applyCostBtn: document.getElementById('nrApplyCostBtn'),
        msg: document.getElementById('nrMsg'),
        toast: document.getElementById('nrToast'),
    };

    var now = new Date();
    var state = {
        house: el.house.value,
        vy: now.getFullYear(),
        vm: now.getMonth(),
        selStart: null,   // строки 'YYYY-MM-DD' — сравниваются лексикографически
        selEnd: null,
    };
    var bookedSet = new Set(booked[state.house] || []);
    var msgTimer = null;

    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function dateKey(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
    function shiftDay(key, delta) {
        var d = toDate(key); d.setDate(d.getDate() + delta);
        return dateKey(d.getFullYear(), d.getMonth(), d.getDate());
    }
    function toDate(key) {
        var p = key.split('-');
        return new Date(+p[0], +p[1] - 1, +p[2]);
    }
    function eachDate(startKey, endKey, fn) {
        var day = toDate(startKey);
        var end = toDate(endKey);
        while (day <= end) {
            fn(dateKey(day.getFullYear(), day.getMonth(), day.getDate()));
            day.setDate(day.getDate() + 1);
        }
    }
    function fmtDay(key) {
        var d = toDate(key);
        return d.getDate() + ' ' + MONTHS_R[d.getMonth()];
    }
    function daysWord(n) {
        var a = n % 100, b = n % 10;
        if (a > 10 && a < 20) return 'дней';
        if (b === 1) return 'день';
        if (b >= 2 && b <= 4) return 'дня';
        return 'дней';
    }

    var todayKey = dateKey(now.getFullYear(), now.getMonth(), now.getDate());

    function render() {
        el.title.textContent = MONTHS[state.vm] + ' ' + state.vy;
        el.grid.innerHTML = '';

        var houseCosts = costs[state.house] || {};
        var first = new Date(state.vy, state.vm, 1);
        var lead = (first.getDay() + 6) % 7;
        var total = new Date(state.vy, state.vm + 1, 0).getDate();
        var frag = document.createDocumentFragment();
        var effEnd = state.selEnd || state.selStart;

        for (var i = 0; i < lead; i++) {
            var empty = document.createElement('div');
            empty.className = 'nr-day is-empty';
            frag.appendChild(empty);
        }
        for (var d = 1; d <= total; d++) {
            var key = dateKey(state.vy, state.vm, d);
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'nr-day';
            btn.setAttribute('data-date', key);

            if (bookedSet.has(key)) {
                btn.className += ' is-closed';
                if (!bookedSet.has(shiftDay(key, -1))) btn.className += ' is-closed-start';
                if (!bookedSet.has(shiftDay(key, 1)))  btn.className += ' is-closed-end';
            }
            if (key < todayKey) btn.className += ' is-past';
            if (key === todayKey) btn.className += ' is-today';
            if (state.selStart && (key === state.selStart || key === effEnd)) btn.className += ' is-edge';
            else if (state.selStart && effEnd && key > state.selStart && key < effEnd) btn.className += ' is-inrange';

            var num = document.createElement('span');
            num.className = 'nr-day__num';
            num.textContent = d;
            var price = document.createElement('span');
            price.className = 'nr-day__price';
            price.textContent = houseCosts[key] != null ? houseCosts[key].toLocaleString('ru-RU') + '₽' : '—';
            btn.appendChild(num);
            btn.appendChild(price);
            frag.appendChild(btn);
        }
        el.grid.appendChild(frag);
        renderActions();
    }

    function renderActions() {
        if (!state.selStart) {
            el.actions.hidden = true;
            return;
        }
        el.actions.hidden = false;

        var effEnd = state.selEnd || state.selStart;
        var count = 0, hasOpen = false, hasClosed = false;
        eachDate(state.selStart, effEnd, function (key) {
            count++;
            if (bookedSet.has(key)) hasClosed = true;
            else hasOpen = true;
        });

        if (state.selStart === effEnd) {
            el.info.textContent = 'Выбрано: ' + fmtDay(state.selStart) + ' ' + toDate(state.selStart).getFullYear();
        } else {
            el.info.textContent = 'Выбрано: ' + fmtDay(state.selStart) + ' — ' + fmtDay(effEnd) + ' ' +
                toDate(effEnd).getFullYear() + ' · ' + count + ' ' + daysWord(count);
        }
        el.closeBtn.style.display = hasOpen ? '' : 'none';
        el.openBtn.style.display = hasClosed ? '' : 'none';
    }

    function clearSelection() {
        state.selStart = null;
        state.selEnd = null;
        el.costEditor.hidden = true;
        hideMsg();
    }

    function showMsg(text, isError) {
        el.msg.textContent = text;
        el.msg.className = 'nr-msg ' + (isError ? 'nr-msg--error' : 'nr-msg--ok');
        el.msg.hidden = false;
    }
    function hideMsg() {
        el.msg.hidden = true;
    }
    function showToast(text) {
        el.toast.textContent = text;
        el.toast.classList.add('is-visible');
        if (msgTimer) clearTimeout(msgTimer);
        msgTimer = setTimeout(function () { el.toast.classList.remove('is-visible'); }, 2500);
    }

    function pickDate(key) {
        hideMsg();
        el.costEditor.hidden = true;
        if (!state.selStart || state.selEnd) {
            state.selStart = key;
            state.selEnd = null;
        } else if (key === state.selStart) {
            state.selStart = null;
        } else if (key < state.selStart) {
            state.selEnd = state.selStart;
            state.selStart = key;
        } else {
            state.selEnd = key;
        }
        render();
    }

    function sendAction(payload, buttons) {
        buttons.forEach(function (b) { b.disabled = true; });
        fetch(ACTION_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': CSRF_TOKEN,
            },
            body: JSON.stringify(payload),
        })
        .then(function (resp) {
            return resp.json().then(function (data) { return { ok: resp.ok, data: data }; });
        })
        .then(function (result) {
            if (!result.ok) {
                showMsg(result.data.error || 'Не удалось сохранить изменения.', true);
                return;
            }
            booked[state.house] = result.data.booked_days;
            costs[state.house] = result.data.dates_object_cost;
            bookedSet = new Set(booked[state.house]);
            clearSelection();
            render();
            showToast('Изменения сохранены');
        })
        .catch(function () {
            showMsg('Ошибка сети. Попробуйте ещё раз.', true);
        })
        .finally(function () {
            buttons.forEach(function (b) { b.disabled = false; });
        });
    }

    function selectionPayload(action) {
        return {
            action: action,
            house: state.house,
            start: state.selStart,
            end: state.selEnd || state.selStart,
        };
    }

    // ==== события ====
    el.grid.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-date]');
        if (btn) pickDate(btn.getAttribute('data-date'));
    });

    el.prev.addEventListener('click', function () {
        state.vm--;
        if (state.vm < 0) { state.vm = 11; state.vy--; }
        render();
    });
    el.next.addEventListener('click', function () {
        state.vm++;
        if (state.vm > 11) { state.vm = 0; state.vy++; }
        render();
    });

    el.house.addEventListener('change', function () {
        state.house = this.value;
        bookedSet = new Set(booked[state.house] || []);
        clearSelection();
        render();
    });

    el.closeBtn.addEventListener('click', function () {
        sendAction(selectionPayload('close'), [el.closeBtn, el.openBtn, el.applyCostBtn]);
    });

    el.openBtn.addEventListener('click', function () {
        if (!confirm('Открыть выбранные даты? Все пересекающиеся с ними брони и закрытия будут удалены.')) return;
        sendAction(selectionPayload('open'), [el.closeBtn, el.openBtn, el.applyCostBtn]);
    });

    el.editBtn.addEventListener('click', function () {
        el.costEditor.hidden = !el.costEditor.hidden;
        if (!el.costEditor.hidden) el.costInput.focus();
    });

    function applyCost() {
        var cost = parseInt(el.costInput.value, 10);
        if (isNaN(cost) || cost < 0) {
            showMsg('Укажите корректную стоимость.', true);
            return;
        }
        var payload = selectionPayload('set_cost');
        payload.cost = cost;
        el.costInput.value = '';
        sendAction(payload, [el.closeBtn, el.openBtn, el.applyCostBtn]);
    }
    el.applyCostBtn.addEventListener('click', applyCost);
    el.costInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); applyCost(); }
    });

    el.clearBtn.addEventListener('click', function () {
        clearSelection();
        render();
    });

    render();
})();
</script>
{% endblock %}
